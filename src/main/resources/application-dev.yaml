server:
  port: 8080
spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
    username: PHARMADB
    password: oracle123
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true
# Trazabilidad en desarrollo: se quiere ver el detalle de las
# consultas y de los parametros que llegan a cada servicio.
logging:
  level:
    root: INFO
    pe.edu.pe.PharmaBackend: DEBUG
    pe.edu.pe.PharmaBackend.service.impl: DEBUG
    org.hibernate.SQL: DEBUG
    # Los parametros SQL incluyen hashes de contrasenas; no registrarlos.
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200,http://127.0.0.1:4201
# JWT en desarrollo. El secreto es una clave Base64 de 48 bytes (384 bits).
# Es SOLO para clase: en produccion llega por variable de entorno.
